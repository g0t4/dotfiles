[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "wes-syntax"
version = "0.1.0"
description = "Wes's shared Pygments palette and Rich source rendering"
requires-python = ">=3.12"
dependencies = [
    "argcomplete>=3.7,<4",
    "colorspacious>=1.1.2,<2",
    "pillow>=11,<13",
    "pygments>=2.19,<3",
    "rich>=13.9,<15",
    "xonsh>=0.24,<0.25",
]

[project.scripts]
highlight = "tools.highlight.__main__:main"

[tool.setuptools]
py-modules = ["explorer"]

[tool.setuptools.packages.find]
include = ["tools*", "wes*"]

[tool.setuptools.package-data]
wes = ["palette.json"]
